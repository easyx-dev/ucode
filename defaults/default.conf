# 安装包自带的默认配置（dotenv 格式）：npm 全局安装后没有 .env(.prod)，这份是最后一档来源。
# 加载优先级（靠后的不覆盖靠前的）：显式环境变量 > 从 cwd 向上找到的 .env(.prod) > 本文件；
# 只在安装包形态下生效，源码树里不加载（那边漏写环境文件会直接报错，避免误写生产目录）。
# 想改就设同名环境变量，或把 .env.prod 放在运行目录（或其祖先目录）下——它整份盖过本文件。
# 模型 / 端点 / API Key 不放这里，通过 /api/v1/config/update 写入 $APP_HOME/app/config.json。

# 工作 / 配置主目录：harness/（auth.json / sessions/）、app/（config.json / app.db）与 workspace/。
# `~` 展开为用户主目录；相对路径按环境文件所在目录解析。
APP_HOME=~/.ucode

# 监听地址与端口（0 表示自选可用端口，启动后写回 service.json）
APP_HOST=127.0.0.1
APP_PORT=19688

# 内存中的 AgentSession 空闲多久后被回收（毫秒）
APP_POOL_IDLE_MS=600000

# 日志级别（trace / debug / info / warn / error / fatal / silent）
APP_LOG_LEVEL=info

# 系统提示词源：custom（自研，默认）/ pi（pi 默认 + 自研片段）；改后需重启
APP_PROMPT_SOURCE=custom
