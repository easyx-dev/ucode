# CI：门禁 + 两条必跑验收（spec §7.3）。
#
# 三条硬要求在这里落地：
# 1. `pnpm check` —— 类型 + Biome + 两道门禁（依赖边界 / 品牌字面量）+ 测试；
# 2. **核心独立安装验收**：核心层打成独立产物、拷出仓库之外运行，纯协议客户端跑通
#    握手 → 建会话 → 对话 → 取历史 → 退出码 0（`tools/acceptance-core-standalone.ts`）；
# 3. **反向验收**：只装壳时依赖树里不含 core/store/data-layer-spec
#    （`tools/acceptance-reverse.ts`）。
#
# 验收用**内置假供应商**，不依赖网络与真实模型——CI 不该因为模型服务抖动而红。

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-acceptance:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段决定，避免两处版本打架
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 门禁（类型 + lint + 依赖边界 + 品牌字面量 + 测试）
        run: pnpm check

      - name: 产出库包 dist（emit 的可跑性单独一关）
        run: pnpm build:libs

      - name: 反向验收（只装壳时依赖树不含 core）
        run: node tools/acceptance-reverse.ts

      - name: 核心独立安装验收（独立产物 + 纯协议客户端）
        run: node tools/acceptance-core-standalone.ts

      - name: 构建控制层壳（Web / 桌面渲染进程）
        run: |
          pnpm -F @ucode/web build
          pnpm -F @ucode/desktop build
