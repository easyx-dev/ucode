name: check

# 只在打 tag 时跑：发布前那棵树必须两个平台的绿灯。Windows 与 Linux 都是目标平台，而开发机只有一个，
# 跨平台回归只能靠这里兜住；分支与 PR 的 push 不跑（省 runner，本地用 `pnpm check` 自查）。
# tag 一推它与 release 并行启动，两者互不阻塞——check 失败只是记在 run 上，拦不住那次发布。
on:
  push:
    tags: ["v*"]

jobs:
  check:
    # 卡住就是真卡住（见下面测试脚本里的 `--v8-pool-size=0`）：宁可失败得快，也不要白占 runner 几小时
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # hub 是独立仓库（submodule）：`pnpm verify` 的 hub-protocol 项要靠它比对两侧的协议副本
          submodules: recursive
      # 版本取自 package.json 的 packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-env.mjs
      - run: pnpm check
