name: check

# Windows 与 Linux 都是目标平台，而开发机只有一个：跨平台回归只能靠这里兜住。
# 两个平台各跑一遍完整的 pnpm check（biome + typecheck + test + verify）。
on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 版本取自 package.json 的 packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-env.mjs
      - run: pnpm check
