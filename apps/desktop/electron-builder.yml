# 桌面壳打包（electron-builder）。
#
# 产物形态：先 `--dir` 出未打包的 .app 验证；dmg/安装包（含签名公证）属发布流程，不在开发期。
# 应用内容：
# - main.mjs / preload.cjs —— 主进程与桥（界面由服务同源发出，随 core-bundle/web-assets 分发）
# - core-bundle/           —— 打包后的服务层 CLI（esbuild 单文件 + 自带 node_modules + Web 产物）
appId: com.earendil.ucode
productName: ucode
directories:
  output: release
  buildResources: assets
files:
  - main.mjs
  - preload.cjs
  - core-bundle/**/*
  - "!core-bundle/node_modules/.cache/**/*"
  # 主进程 import 的纯 JS 模块（凭据存储等）：不在 files 里就打包不进去
  - src/native/**/*
  - "!src/native/**/*.test.ts"
  - package.json
asar: true
# 主进程要 spawn core-bundle 里的服务层进程并访问其 node_modules：
# asar 里无法 exec，因此把服务层目录拆出 asar（extraResources），主进程按打包布局解析路径
asarUnpack:
  - core-bundle/**/*
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - dir
