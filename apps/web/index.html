<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>%BRAND_TITLE%</title>
    <script>
      // 首屏渲染前定主题与语言，避免深色用户看到闪白、读屏在切换前拿到错误语言；
      // 键与 ThemeProvider / i18n 的 storageKey 一致。
      // 这段脚本在打包前执行，只能用它自带的朴素写法；不用 IIFE、不用 var。
      try {
        const stored = localStorage.getItem("%BRAND_THEME_KEY%");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const followsSystem = stored !== "light" && stored !== "dark";
        document.documentElement.classList.toggle("dark", stored === "dark" || (followsSystem && prefersDark));
        const locale = localStorage.getItem("%BRAND_LOCALE_KEY%");
        if (locale === "zh-CN" || locale === "en") document.documentElement.lang = locale;
      } catch {
        // localStorage 不可用时按浅色与默认语言渲染，交给 React 侧纠正
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
