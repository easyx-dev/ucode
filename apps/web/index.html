<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 挂载前缀的唯一事实源：直连服务时是 `/`，经中继按路径访问时由服务端改写成 `/<前缀>/` -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>%BRAND_TITLE%</title>
    <script>
      // 首屏渲染前定主题与语言，避免深色用户看到闪白、读屏在切换前拿到错误语言；
      // 键与 ThemeProvider / i18n 的 storageKey 一致。
      // 这段脚本在打包前执行，只能用它自带的朴素写法；不用 IIFE、不用 var。
      try {
        const stored = localStorage.getItem("%BRAND_THEME_KEY%");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const followsSystem = stored !== "light" && stored !== "dark";
        document.documentElement.classList.toggle("dark", stored === "dark" || (followsSystem && prefersDark));
        const locale = localStorage.getItem("%BRAND_LOCALE_KEY%");
        if (locale === "zh-CN" || locale === "en") document.documentElement.lang = locale;
        // 外观参数（字号 / 密度 / 配色主题）预先写进根节点，否则首帧会用默认字号与配色。
        // 字体不在这里应用：它需要按需加载，交给运行时，未加载完本来就该用回退字体。
        // 区间与档位改动时同步 `packages/ui/src/provider/appearance.ts`。
        const appearance = localStorage.getItem("%BRAND_APPEARANCE_KEY%");
        if (appearance) {
          const prefs = JSON.parse(appearance);
          const size = Number(prefs.fontSizeBase);
          if (size >= 14 && size <= 22) {
            document.documentElement.style.setProperty("--font-size-base", size + "px");
          }
          const density = prefs.density === "compact" ? 0.9 : prefs.density === "cozy" ? 1.1 : 1;
          document.documentElement.style.setProperty("--density", String(density));
          // 直接透传主题 id：不在这里维护清单，非法值没有对应的主题块，等同默认
          if (prefs.theme) document.documentElement.dataset.theme = prefs.theme;
        }
      } catch {
        // localStorage 不可用时按浅色与默认语言渲染，交给 React 侧纠正
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
